<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>GTYMS Driver Live Tracking</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Noto Sans Devanagari",system-ui,sans-serif;
      background:#fff8ea;
      color:#2c1b15;
    }
    .wrap{
      width:min(680px,calc(100% - 28px));
      margin:34px auto;
    }
    .card{
      background:#fff;
      border:1px solid #eadbc7;
      border-radius:20px;
      box-shadow:0 18px 48px rgba(65,36,20,.12);
      padding:24px;
    }
    h1{margin-top:0}
    label{display:block;font-weight:700;margin:12px 0 6px}
    input{
      width:100%;
      padding:12px 13px;
      border:1px solid #d9c8b8;
      border-radius:12px;
      font:inherit;
    }
    button{
      width:100%;
      margin-top:14px;
      min-height:48px;
      border:0;
      border-radius:12px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
    }
    .primary{background:#8b1e1e;color:#fff}
    .secondary{background:#d4a017;color:#fff}
    .danger{background:#b42318;color:#fff}
    .status{
      margin-top:16px;
      padding:14px;
      border-radius:12px;
      background:#f6efe8;
    }
    .hidden{display:none}
    .note{
      margin-top:16px;
      font-size:.9rem;
      color:#6f625c;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="card">
      <h1>Driver Live Tracking</h1>
      <p>
        Location sharing सुरु गर्दा तपाईंको browser ले GPS permission माग्नेछ ।
        तपाईंले स्पष्ट अनुमति दिएपछि मात्र location share हुन्छ ।
      </p>

      <label for="trackingKey">Tracking Key</label>
      <input id="trackingKey" autocomplete="off">

      <button id="validateBtn" class="secondary" type="button">
        यात्रा Verify गर्नुहोस्
      </button>

      <div id="assignmentBox" class="status hidden"></div>

      <button id="startBtn" class="primary hidden" type="button">
        Live Location Sharing सुरु गर्नुहोस्
      </button>

      <button id="stopBtn" class="danger hidden" type="button">
        Location Sharing रोक्नुहोस्
      </button>

      <div id="locationStatus" class="status hidden"></div>

      <div class="note">
        Location sharing रोक्न “Location Sharing रोक्नुहोस्” थिच्नुहोस् वा browser tab बन्द गर्नुहोस् ।
      </div>
    </div>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzrKZBb_lg8TiI_HHp390Cscr31XWgcnsG0Jp5qFkkpUYaCoin3TLnJ6TY1RDFyRuI2/exec";

    let watchId = null;
    let lastSentAt = 0;
    let trackingKey = "";

    async function apiGet(action, params = {}) {
      const url = new URL(API_URL);
      url.searchParams.set("action", action);

      Object.entries(params).forEach(([key, value]) => {
        url.searchParams.set(key, value);
      });

      const response = await fetch(url.toString());
      const json = await response.json();

      if (!json.success) {
        throw new Error(
          json.error?.message || "Request failed"
        );
      }

      return json.data;
    }

    async function apiPost(action, payload = {}) {
      const body = Object.assign(
        { action },
        payload
      );

      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(body)
      });

      const json = await response.json();

      if (!json.success) {
        throw new Error(
          json.error?.message || "Request failed"
        );
      }

      return json.data;
    }

    const $ = id =>
      document.getElementById(id);

    $("validateBtn").onclick = async () => {
      trackingKey =
        $("trackingKey").value.trim();

      if (!trackingKey) return;

      try {
        const data = await apiGet(
          "validateDriverTrackingKey",
          { trackingKey }
        );

        $("assignmentBox").innerHTML = `
          <strong>${data.tripTitle || ""}</strong><br>
          Vehicle: ${data.vehicleNumber || "-"}<br>
          Driver: ${data.driverName || "-"}<br>
          Tracking Status: ${data.trackingStatus || ""}
        `;

        $("assignmentBox").classList.remove("hidden");
        $("startBtn").classList.remove("hidden");

      } catch (error) {
        alert(error.message);
      }
    };

    $("startBtn").onclick = () => {
      if (!navigator.geolocation) {
        alert("यो browser मा GPS उपलब्ध छैन ।");
        return;
      }

      if (!trackingKey) {
        alert("Tracking Key verify गर्नुहोस् ।");
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        sendPosition,
        error => {
          $("locationStatus").textContent =
            "GPS Error: " + error.message;
          $("locationStatus").classList.remove("hidden");
        },
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 15000
        }
      );

      $("startBtn").classList.add("hidden");
      $("stopBtn").classList.remove("hidden");

      $("locationStatus").textContent =
        "Live Location Sharing सुरु भयो ।";
      $("locationStatus").classList.remove("hidden");
    };

    async function sendPosition(position) {
      const now = Date.now();

      // Avoid excessive requests; send roughly every 20 seconds.
      if (now - lastSentAt < 20000) return;
      lastSentAt = now;

      try {
        const c = position.coords;

        await apiPost(
          "submitDriverLocation",
          {
            trackingKey,
            latitude: c.latitude,
            longitude: c.longitude,
            accuracy: c.accuracy || 0,
            speed: c.speed || 0,
            heading: c.heading || 0
          }
        );

        $("locationStatus").innerHTML = `
          Location sent successfully ।<br>
          Accuracy: ${Math.round(c.accuracy || 0)} m<br>
          Updated: ${new Date().toLocaleTimeString()}
        `;

      } catch (error) {
        $("locationStatus").textContent =
          error.message;
      }
    }

    $("stopBtn").onclick = () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      $("stopBtn").classList.add("hidden");
      $("startBtn").classList.remove("hidden");

      $("locationStatus").textContent =
        "Location Sharing रोकियो ।";
    };
  </script>
</body>
</html>
