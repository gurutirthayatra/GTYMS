<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Member Verification v3.0.4 | Guru Tirtha Yatra Sewa</title>

  <style>
    :root{
      --primary:#8b1e1e;
      --gold:#d4a017;
      --bg:#fff8ea;
      --text:#2c1b15;
      --muted:#6f625c;
      --border:#eadbc7;
      --success:#177245;
      --danger:#b42318;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:"Noto Sans Devanagari",system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .card{
      width:min(620px,100%);
      background:#fff;
      border:1px solid var(--border);
      border-radius:22px;
      padding:26px;
      box-shadow:0 20px 60px rgba(65,36,20,.12);
    }

    .brand{
      color:var(--primary);
      font-weight:900;
      font-size:1.25rem;
    }

    .status{
      margin:20px 0;
      border-radius:16px;
      padding:18px;
      text-align:center;
      font-size:1.15rem;
      font-weight:900;
    }

    .ok{
      background:#edf8f2;
      color:var(--success);
    }

    .bad{
      background:#fde7e3;
      color:var(--danger);
    }

    .details{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .detail{
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
      background:#fffdf8;
    }

    .detail small{
      display:block;
      color:var(--muted);
      margin-bottom:4px;
    }

    @media(max-width:560px){
      .details{
        grid-template-columns:1fr;
      }
    }
  
    .verify-time{
      margin-top:16px;
      text-align:center;
      color:var(--muted);
      font-size:.82rem;
    }

    .official-note{
      margin-top:18px;
      padding:12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fffdf8;
      color:var(--muted);
      font-size:.86rem;
      line-height:1.55;
    }


  /* =========================================================
     GTYMS v3.0.4 - Universal Button / Action Feedback
     Universal UX rule:
     Click -> instant response -> short spinner -> restore
     Prevents accidental rapid double-clicks.
     ========================================================= */

  button.gtyms-action-feedback,
  a.gtyms-action-feedback,
  [role="button"].gtyms-action-feedback{
    position:relative!important;
    pointer-events:none!important;
    opacity:.82!important;
  }

  button.gtyms-action-feedback::after,
  a.gtyms-action-feedback::after,
  [role="button"].gtyms-action-feedback::after{
    content:"";
    display:inline-block;
    width:13px;
    height:13px;
    margin-left:8px;
    vertical-align:-2px;
    border:2px solid currentColor;
    border-right-color:transparent;
    border-radius:50%;
    animation:gtymsActionSpin .65s linear infinite;
  }

  @keyframes gtymsActionSpin{
    to{transform:rotate(360deg)}
  }

  .gtyms-click-flash{
    transform:scale(.98);
    filter:brightness(.97);
    transition:transform .12s ease,filter .12s ease;
  }

</style>
</head>

<body>
  <main class="card">
    <div class="brand">
      Guru Tirtha Yatra Sewa
    </div>

    <p style="color:var(--muted)">
      Digital Membership Verification
    </p>

    <div id="verificationResult">
      Verification हुँदैछ...
    </div>

    <div class="official-note">
      यो page Guru Tirtha Yatra Sewa को Digital Membership Verification का लागि हो ।
      Member को सुरक्षित सार्वजनिक विवरण मात्र देखाइन्छ ।
    </div>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzrKZBb_lg8TiI_HHp390Cscr31XWgcnsG0Jp5qFkkpUYaCoin3TLnJ6TY1RDFyRuI2/exec";

    const $=id=>
      document.getElementById(id);

    function esc(value){
      return String(value??"")
        .replace(/[&<>"']/g,ch=>({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[ch]));
    }

    async function verify(){
      const params=
        new URLSearchParams(
          window.location.search
        );

      const memberId=
        params.get("memberId")||"";

      const token=
        params.get("token")||"";

      if(!memberId || !token){
        renderError(
          "Verification Link अपूर्ण छ ।"
        );
        return;
      }

      const url=
        new URL(API_URL);

      url.searchParams.set(
        "action",
        "verifyMemberPublic"
      );

      url.searchParams.set(
        "memberId",
        memberId
      );

      url.searchParams.set(
        "verifyToken",
        token
      );

      try{
        const response=
          await fetch(
            url.toString()
          );

        const json=
          await response.json();

        if(!json.success){
          throw new Error(
            json.error?.message||
            "Verification failed"
          );
        }

        renderResult(
          json.data
        );

      }catch(error){
        renderError(
          error.message||
          "Verification हुन सकेन ।"
        );
      }
    }

    function renderResult(data){
      const member=
        data.member||{};

      const verified=
        !!data.verified;

      $("verificationResult")
        .innerHTML=`
          <div class="status ${verified?"ok":"bad"}">
            ${
              verified
                ?"✓ VERIFIED ACTIVE MEMBER"
                :"✕ MEMBER NOT ACTIVE / NOT VERIFIED"
            }
          </div>

          <div class="details">
            <div class="detail">
              <small>Member Name</small>
              <strong>${esc(member.fullName||"")}</strong>
            </div>

            <div class="detail">
              <small>Member ID</small>
              <strong>${esc(member.memberId||"")}</strong>
            </div>

            <div class="detail">
              <small>Membership Level</small>
              <strong>${esc(member.membershipLevel||"")}</strong>
            </div>

            <div class="detail">
              <small>Status</small>
              <strong>${esc(member.status||"")}</strong>
            </div>

            <div class="detail">
              <small>District</small>
              <strong>${esc(member.district||"-")}</strong>
            </div>

            <div class="detail">
              <small>Total Trips</small>
              <strong>${esc(member.totalTrips||0)}</strong>
            </div>

            <div class="detail">
              <small>Reward Points</small>
              <strong>${esc(member.rewardPoints||0)}</strong>
            </div>

            <div class="detail">
              <small>Approval</small>
              <strong>${esc(member.approvalStatus||"")}</strong>
            </div>
          </div>

          <div class="verify-time">
            Verified at:
            ${esc(new Date().toLocaleString())}
          </div>
        `;
    }

    function renderError(message){
      $("verificationResult")
        .innerHTML=`
          <div class="status bad">
            ${esc(message)}
          </div>
        `;
    }

    verify();
  </script>

  <script>
  /* =========================================================
     GTYMS v3.0.4 Universal Frontend Action Feedback
     Non-invasive: does not change existing business logic.
     ========================================================= */
  (function(){
    "use strict";

    const ACTIVE_CLASS="gtyms-action-feedback";
    const FLASH_CLASS="gtyms-click-flash";
    const FEEDBACK_MS=900;

    function isUsableActionElement(el){
      if(!el)return false;

      if(
        el.matches(
          "button, a[href], [role='button'], input[type='button'], input[type='submit']"
        )
      ){
        return true;
      }

      return false;
    }

    function findActionElement(target){
      if(!target || !target.closest)return null;

      return target.closest(
        "button, a[href], [role='button'], input[type='button'], input[type='submit']"
      );
    }

    function shouldSkip(el){
      if(!el)return true;

      if(
        el.disabled ||
        el.getAttribute("aria-disabled")==="true" ||
        el.classList.contains(ACTIVE_CLASS)
      ){
        return true;
      }

      // Do not delay native select/file controls.
      if(
        el.matches("input[type='file']")
      ){
        return true;
      }

      return false;
    }

    function showFeedback(el){
      if(
        !isUsableActionElement(el) ||
        shouldSkip(el)
      ){
        return;
      }

      el.classList.add(
        FLASH_CLASS
      );

      window.setTimeout(
        ()=>el.classList.remove(
          FLASH_CLASS
        ),
        140
      );

      // Native <input> pseudo-elements are inconsistent.
      // For them, visual click flash is enough.
      if(el.tagName==="INPUT"){
        return;
      }

      el.classList.add(
        ACTIVE_CLASS
      );

      el.setAttribute(
        "aria-busy",
        "true"
      );

      window.setTimeout(
        ()=>{
          el.classList.remove(
            ACTIVE_CLASS
          );

          el.removeAttribute(
            "aria-busy"
          );
        },
        FEEDBACK_MS
      );
    }

    document.addEventListener(
      "click",
      event=>{
        showFeedback(
          findActionElement(
            event.target
          )
        );
      },
      true
    );

    // Keyboard form submit (Enter) also gets feedback.
    document.addEventListener(
      "submit",
      event=>{
        const form=
          event.target;

        if(!form || !form.querySelector){
          return;
        }

        const submitter=
          event.submitter ||
          form.querySelector(
            "button[type='submit'], input[type='submit']"
          );

        showFeedback(
          submitter
        );
      },
      true
    );

    // Programmatic helper for future modules.
    window.GTYMSActionUX={
      start:function(el){
        showFeedback(el);
      },

      stop:function(el){
        if(!el)return;

        el.classList.remove(
          ACTIVE_CLASS,
          FLASH_CLASS
        );

        el.removeAttribute(
          "aria-busy"
        );
      }
    };
  })();
  </script>

</body>
</html>
