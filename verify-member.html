<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Member Verification | Guru Tirtha Yatra Sewa</title>

  <style>
    :root{
      --primary:#8b1e1e;
      --gold:#d4a017;
      --bg:#fff8ea;
      --text:#2c1b15;
      --muted:#6f625c;
      --border:#eadbc7;
      --success:#177245;
      --danger:#b42318;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:"Noto Sans Devanagari",system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .card{
      width:min(620px,100%);
      background:#fff;
      border:1px solid var(--border);
      border-radius:22px;
      padding:26px;
      box-shadow:0 20px 60px rgba(65,36,20,.12);
    }

    .brand{
      color:var(--primary);
      font-weight:900;
      font-size:1.25rem;
    }

    .status{
      margin:20px 0;
      border-radius:16px;
      padding:18px;
      text-align:center;
      font-size:1.15rem;
      font-weight:900;
    }

    .ok{
      background:#edf8f2;
      color:var(--success);
    }

    .bad{
      background:#fde7e3;
      color:var(--danger);
    }

    .details{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .detail{
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
      background:#fffdf8;
    }

    .detail small{
      display:block;
      color:var(--muted);
      margin-bottom:4px;
    }

    @media(max-width:560px){
      .details{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">
      Guru Tirtha Yatra Sewa
    </div>

    <p style="color:var(--muted)">
      Digital Membership Verification
    </p>

    <div id="verificationResult">
      Verification हुँदैछ...
    </div>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzrKZBb_lg8TiI_HHp390Cscr31XWgcnsG0Jp5qFkkpUYaCoin3TLnJ6TY1RDFyRuI2/exec";

    const $=id=>
      document.getElementById(id);

    function esc(value){
      return String(value??"")
        .replace(/[&<>"']/g,ch=>({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[ch]));
    }

    async function verify(){
      const params=
        new URLSearchParams(
          window.location.search
        );

      const memberId=
        params.get("memberId")||"";

      const token=
        params.get("token")||"";

      if(!memberId || !token){
        renderError(
          "Verification Link अपूर्ण छ ।"
        );
        return;
      }

      const url=
        new URL(API_URL);

      url.searchParams.set(
        "action",
        "verifyMemberPublic"
      );

      url.searchParams.set(
        "memberId",
        memberId
      );

      url.searchParams.set(
        "verifyToken",
        token
      );

      try{
        const response=
          await fetch(
            url.toString()
          );

        const json=
          await response.json();

        if(!json.success){
          throw new Error(
            json.error?.message||
            "Verification failed"
          );
        }

        renderResult(
          json.data
        );

      }catch(error){
        renderError(
          error.message||
          "Verification हुन सकेन ।"
        );
      }
    }

    function renderResult(data){
      const member=
        data.member||{};

      const verified=
        !!data.verified;

      $("verificationResult")
        .innerHTML=`
          <div class="status ${verified?"ok":"bad"}">
            ${
              verified
                ?"✓ VERIFIED ACTIVE MEMBER"
                :"✕ MEMBER NOT ACTIVE / NOT VERIFIED"
            }
          </div>

          <div class="details">
            <div class="detail">
              <small>Member Name</small>
              <strong>${esc(member.fullName||"")}</strong>
            </div>

            <div class="detail">
              <small>Member ID</small>
              <strong>${esc(member.memberId||"")}</strong>
            </div>

            <div class="detail">
              <small>Membership Level</small>
              <strong>${esc(member.membershipLevel||"")}</strong>
            </div>

            <div class="detail">
              <small>Status</small>
              <strong>${esc(member.status||"")}</strong>
            </div>

            <div class="detail">
              <small>District</small>
              <strong>${esc(member.district||"-")}</strong>
            </div>

            <div class="detail">
              <small>Total Trips</small>
              <strong>${esc(member.totalTrips||0)}</strong>
            </div>

            <div class="detail">
              <small>Reward Points</small>
              <strong>${esc(member.rewardPoints||0)}</strong>
            </div>

            <div class="detail">
              <small>Approval</small>
              <strong>${esc(member.approvalStatus||"")}</strong>
            </div>
          </div>
        `;
    }

    function renderError(message){
      $("verificationResult")
        .innerHTML=`
          <div class="status bad">
            ${esc(message)}
          </div>
        `;
    }

    verify();
  </script>
</body>
</html>
