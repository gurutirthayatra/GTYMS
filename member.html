<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Pilgrim Member Portal v2.8.2 | Guru Tirtha Yatra Sewa</title>

  <style>
    :root{
      --primary:#8b1e1e;
      --primary-dark:#5f1414;
      --gold:#d4a017;
      --bg:#fff8ea;
      --surface:#fff;
      --soft:#f6efe8;
      --text:#2c1b15;
      --muted:#6f625c;
      --border:#eadbc7;
      --success:#177245;
      --danger:#b42318;
      --shadow:0 18px 48px rgba(65,36,20,.12);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:"Noto Sans Devanagari",system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .hidden{display:none!important}

    .wrap{
      width:min(1180px,calc(100% - 28px));
      margin:24px auto 50px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:center;
      margin-bottom:18px;
    }

    .brand h1{
      margin:0;
      color:var(--primary);
      font-size:1.5rem;
    }

    .brand small{color:var(--muted)}

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:20px;
    }

    .login{
      width:min(520px,100%);
      margin:70px auto;
    }

    label{
      display:block;
      font-weight:700;
      margin:12px 0 6px;
    }

    input,select,textarea{
      width:100%;
      padding:12px 13px;
      border:1px solid #d9c8b8;
      border-radius:11px;
      font:inherit;
      background:#fff;
    }

    button,.btn{
      border:0;
      border-radius:11px;
      min-height:44px;
      padding:10px 14px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .primary{background:var(--primary);color:#fff}
    .soft{background:#f3e8df;color:var(--primary)}
    .danger{background:var(--danger);color:#fff}

    .dashboard-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:16px;
    }

    .stat{
      padding:16px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
    }

    .stat small{
      display:block;
      color:var(--muted);
      margin-bottom:4px;
    }

    .stat strong{
      font-size:1.2rem;
    }

    .layout{
      display:grid;
      grid-template-columns:230px 1fr;
      gap:18px;
    }

    .menu{
      display:grid;
      gap:7px;
      align-content:start;
    }

    .menu button{
      justify-content:flex-start;
      background:#fff;
      border:1px solid var(--border);
      color:var(--text);
    }

    .menu button.active{
      background:var(--primary);
      color:#fff;
    }

    .member-card{
      border:2px solid var(--gold);
      border-radius:18px;
      padding:20px;
      background:linear-gradient(135deg,#fffdf5,#fff6d8);
    }

    .member-card-top{
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:center;
    }

    .member-level{
      display:inline-block;
      margin-top:8px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--primary);
      color:#fff;
      font-weight:800;
    }

    .table-wrap{overflow:auto}

    table{
      width:100%;
      border-collapse:collapse;
      min-width:720px;
    }

    th,td{
      padding:11px 10px;
      border-bottom:1px solid var(--border);
      text-align:left;
      vertical-align:top;
    }

    th{
      background:#faf5ef;
      color:var(--primary);
    }

    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .section-title{
      margin-top:0;
      color:var(--primary);
    }

    .message{
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      background:#edf8f2;
      color:#155f3b;
    }

    @media(max-width:860px){
      .layout{grid-template-columns:1fr}
      .menu{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }
      .dashboard-grid{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:560px){
      .dashboard-grid{
        grid-template-columns:1fr;
      }
      .menu{
        grid-template-columns:1fr 1fr;
      }
      .member-card-top{
        align-items:flex-start;
        flex-direction:column;
      }
    }
  
    .auth-switch{
      display:flex;
      gap:8px;
      margin:18px 0 8px;
    }

    .auth-switch button{
      flex:1;
      background:#fff;
      color:var(--primary);
      border:1px solid var(--border);
    }

    .auth-switch button.active{
      background:var(--primary);
      color:#fff;
    }

    .register-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .register-grid .full{
      grid-column:1/-1;
    }

    .otp-box{
      margin-top:16px;
      padding:16px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fffaf3;
    }

    .registration-success{
      padding:18px;
      border-radius:14px;
      background:#edf8f2;
      color:#155f3b;
      margin-top:16px;
    }

    @media(max-width:560px){
      .register-grid{
        grid-template-columns:1fr;
      }

      .register-grid .full{
        grid-column:auto;
      }
    }


    .smart-address-loading{
      opacity:.65;
      pointer-events:none;
    }

    select:disabled{
      background:#f3eee8;
      color:#8a817c;
      cursor:not-allowed;
    }

    .address-help{
      color:var(--muted);
      font-size:.82rem;
      margin-top:4px;
    }


    .digital-card{
      position:relative;
      overflow:hidden;
      border:2px solid var(--gold);
      border-radius:22px;
      padding:22px;
      background:
        radial-gradient(circle at top right,rgba(212,160,23,.18),transparent 34%),
        linear-gradient(135deg,#fffdf6,#fff3c9);
    }

    .digital-card::after{
      content:"ॐ";
      position:absolute;
      right:18px;
      top:6px;
      font-size:5rem;
      opacity:.06;
      color:var(--primary);
    }

    .digital-card-grid{
      display:grid;
      grid-template-columns:1fr 190px;
      gap:22px;
      align-items:center;
    }

    .qr-box{
      background:#fff;
      border:1px solid #dfcfaa;
      border-radius:16px;
      padding:12px;
      text-align:center;
    }

    #memberQrCanvas{
      max-width:100%;
      height:auto;
    }

    .verification-link{
      margin-top:8px;
      font-size:.78rem;
      word-break:break-all;
      color:var(--muted);
    }

    @media(max-width:680px){
      .digital-card-grid{
        grid-template-columns:1fr;
      }

      .qr-box{
        width:min(220px,100%);
      }
    }

    @media print{
      body *{
        visibility:hidden;
      }

      #memberContent,
      #memberContent *{
        visibility:visible;
      }

      #memberContent{
        position:absolute;
        inset:0;
        width:100%;
      }

      .toolbar{
        display:none!important;
      }
    }


    /* GTYMS v2.8.2 – Digital Membership Card UX Final */
    .card-hero{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:center;
      padding:14px 16px;
      margin-bottom:16px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fffdf7;
    }

    .card-hero strong{
      color:var(--primary);
    }

    .verified-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 11px;
      border-radius:999px;
      background:#edf8f2;
      color:var(--success);
      font-weight:900;
      font-size:.86rem;
    }

    .member-id-large{
      font-size:1.2rem;
      font-weight:950;
      color:var(--primary);
      letter-spacing:.4px;
    }

    .card-actions-final{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .card-actions-final button,
    .card-actions-final a{
      min-height:42px;
    }

    .qr-status{
      margin-top:9px;
      font-size:.82rem;
      color:var(--muted);
    }

    .qr-status.ok{
      color:var(--success);
      font-weight:800;
    }

    @media(max-width:620px){
      .card-hero{
        align-items:flex-start;
        flex-direction:column;
      }

      .card-actions-final{
        display:grid;
        grid-template-columns:1fr 1fr;
      }

      .card-actions-final button,
      .card-actions-final a{
        width:100%;
      }
    }

</style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>

<body>
  <main class="wrap">
    <section id="loginView" class="login card">
      <div class="brand">
        <h1>Guru Tirtha Yatra Sewa</h1>
        <small>Pilgrim / Member Portal</small>
      </div>

      <div class="auth-switch">
        <button id="showLoginBtn" type="button" class="active">
          Member Login
        </button>

        <button id="showRegisterBtn" type="button">
          नयाँ Member Registration
        </button>
      </div>

      <div id="loginPanel">
        <form id="memberLoginForm">
          <label>Membership No *</label>
          <input name="membershipNo" required>

          <label>Registered Mobile *</label>
          <input name="mobile" inputmode="tel" required>

          <label>Member PIN</label>
          <input name="pin" type="password" inputmode="numeric" placeholder="यदि PIN सेट गरिएको छ भने">

          <button class="primary" type="submit" style="width:100%;margin-top:16px">
            Member Login
          </button>
        </form>

        <div id="loginMessage"></div>
      </div>

      <div id="registerPanel" class="hidden">
        <form id="memberRegistrationForm">
          <div class="register-grid">
            <div class="full">
              <label>Full Name *</label>
              <input name="fullName" required>
            </div>

            <div>
              <label>Mobile *</label>
              <input name="mobile" inputmode="tel" required placeholder="98XXXXXXXX">
            </div>

            <div>
              <label>Email *</label>
              <input name="email" type="email" required>
            </div>

            <div>
              <label>Gender</label>
              <select name="gender">
                <option value="">छान्नुहोस्</option>
                <option value="MALE">पुरुष</option>
                <option value="FEMALE">महिला</option>
                <option value="OTHER">अन्य</option>
              </select>
            </div>

            <div>
              <label>Province *</label>
              <select
                id="regProvince"
                name="province"
                required>
                <option value="">
                  Province छान्नुहोस्
                </option>
              </select>
            </div>

            <div>
              <label>District *</label>
              <select
                id="regDistrict"
                name="district"
                required
                disabled>
                <option value="">
                  पहिले Province छान्नुहोस्
                </option>
              </select>
            </div>

            <div>
              <label>Municipality / Rural Municipality *</label>
              <select
                id="regMunicipality"
                name="municipality"
                required
                disabled>
                <option value="">
                  पहिले District छान्नुहोस्
                </option>
              </select>
            </div>

            <div>
              <label>Ward No. *</label>
              <select
                id="regWard"
                name="wardNo"
                required
                disabled>
                <option value="">
                  पहिले Local Level छान्नुहोस्
                </option>
              </select>
            </div>

            <div class="full">
              <label>Address</label>
              <input name="address">
            </div>

            <div>
              <label>Emergency Contact Name</label>
              <input name="emergencyContactName">
            </div>

            <div>
              <label>Relation</label>
              <input name="emergencyContactRelation">
            </div>

            <div>
              <label>Emergency Contact Mobile</label>
              <input name="emergencyContactMobile" inputmode="tel">
            </div>

            <div>
              <label>Preferred Food</label>
              <select name="preferredFood">
                <option value="VEGETARIAN">VEGETARIAN</option>
                <option value="JAIN">JAIN</option>
                <option value="OTHER">OTHER</option>
              </select>
            </div>

            <label class="full">
              <input type="checkbox" name="whatsAppConsent" style="width:auto">
              WhatsApp सूचना प्राप्त गर्न सहमत छु ।
            </label>

            <label class="full">
              <input type="checkbox" name="emailConsent" checked style="width:auto">
              Email सूचना प्राप्त गर्न सहमत छु ।
            </label>

            <label class="full">
              <input type="checkbox" name="termsAccepted" required style="width:auto">
              Member Registration का नियम तथा सर्त स्वीकार गर्दछु । *
            </label>
          </div>

          <button
            id="sendRegistrationOtpBtn"
            class="primary"
            type="submit"
            style="width:100%;margin-top:16px">
            Email OTP पठाउनुहोस्
          </button>
        </form>

        <div id="registrationMessage"></div>

        <div id="registrationOtpBox" class="otp-box hidden">
          <strong>Email OTP Verification</strong>
          <p id="otpSentMessage"></p>

          <form id="registrationOtpForm">
            <label>6-digit OTP *</label>
            <input
              name="otp"
              inputmode="numeric"
              maxlength="6"
              pattern="[0-9]{6}"

            <button

              type="submit"

        <div
          id="registrationSuccess"
          class="registration-success hidden">

        <div class="otp-box" style="margin-top:18px">
          <strong>Application Status हेर्नुहोस्</strong>

          <form
            id="applicationStatusForm"
            style="margin-top:10px">

            <label>Application ID</label>
            <input
              name="applicationId"
              required
              placeholder="APP-...">

            <label>Registered Mobile</label>
            <input
              name="mobile"
              inputmode="tel"
              required>

            <button
              class="soft"
              type="submit"
              style="width:100%;margin-top:12px">
              Status Check
            </button>

          <div id="applicationStatusResult"></div>
        </div>
      </div>
    </section>

    <section id="portalView" class="hidden">
      <div class="topbar">
        <div class="brand">
          <h1>Guru Tirtha Yatra Sewa</h1>
          <small id="memberWelcome">Member Portal</small>
        </div>

        <button id="memberLogoutBtn" class="danger" type="button">
          Logout
        </button>
      </div>

      <div id="memberStats" class="dashboard-grid"></div>

      <div class="layout">
        <aside class="menu card">
          <button data-view="card" class="active">🪪 Digital Membership Card</button>
          <button data-view="profile">👤 Profile</button>
          <button data-view="bookings">📋 Bookings</button>
          <button data-view="payments">💳 Payments</button>
          <button data-view="tickets">🎫 E-Tickets</button>
          <button data-view="rewards">🎁 Rewards</button>
          <button data-view="security">🔐 PIN / Security</button>
        </aside>

        <section id="memberContent" class="card"></section>
      </div>
    </section>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzrKZBb_lg8TiI_HHp390Cscr31XWgcnsG0Jp5qFkkpUYaCoin3TLnJ6TY1RDFyRuI2/exec";

    const state = {
      token:
        localStorage.getItem("gtymsMemberToken") || "",
      dashboard:null,
      profile:null
    };

    const $ = id =>
      document.getElementById(id);

    function esc(value){
      return String(value??"")
        .replace(/[&<>"']/g,ch=>({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[ch]));
    }

    function money(value){
      return Number(value||0)
        .toLocaleString("en-IN");
    }

    async function api(
      action,
      payload={},
      method="GET"
    ){
      let response;

      if(method==="POST"){
        response=await fetch(API_URL,{
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:JSON.stringify(
            Object.assign(
              {action},
              payload
            )
          )
        });
      }else{
        const url=new URL(API_URL);
        url.searchParams.set(
          "action",
          action
        );

        Object.entries(payload)
          .forEach(([key,value])=>{
            if(
              value!==undefined &&
              value!==null
            ){
              url.searchParams.set(
                key,
                value
              );
            }
          });

        response=
          await fetch(
            url.toString()
          );
      }

      const json=
        await response.json();

      if(!json.success){
        const error=
          new Error(
            json.error?.message ||
            "Request failed"
          );

        error.code=
          json.error?.code||"";

        throw error;
      }

      return json.data;
    }

    function showLogin(){
      $("loginView")
        .classList.remove("hidden");

      $("portalView")
        .classList.add("hidden");
    }

    function showPortal(){
      $("loginView")
        .classList.add("hidden");

      $("portalView")
        .classList.remove("hidden");
    }

    async function initializePortal(){
      if(!state.token){
        showLogin();
        return;
      }

      try{
        await loadDashboard();
        showPortal();
        renderMemberCard();
      }catch(error){
        localStorage.removeItem(
          "gtymsMemberToken"
        );

        state.token="";
        showLogin();
      }
    }



    const NEPAL_LOCATION_CACHE_KEY =
      "gtymsNepalLocationMasterV273";

    const NEPAL_LOCATION_CACHE_MS =
      24 * 60 * 60 * 1000;

    const nepalAddressState = {
      master: null,
      loadingPromise: null
    };

    function readNepalMasterCache(){
      try{
        const raw=
          localStorage.getItem(
            NEPAL_LOCATION_CACHE_KEY
          );

        if(!raw)return null;

        const cached=
          JSON.parse(raw);

        if(
          !cached.savedAt ||
          Date.now() -
            Number(cached.savedAt) >
            NEPAL_LOCATION_CACHE_MS ||
          !cached.data ||
          !Array.isArray(
            cached.data.items
          )
        ){
          localStorage.removeItem(
            NEPAL_LOCATION_CACHE_KEY
          );
          return null;
        }

        return cached.data;

      }catch(error){
        localStorage.removeItem(
          NEPAL_LOCATION_CACHE_KEY
        );
        return null;
      }
    }

    function writeNepalMasterCache(data){
      try{
        localStorage.setItem(
          NEPAL_LOCATION_CACHE_KEY,
          JSON.stringify({
            savedAt:Date.now(),
            data
          })
        );
      }catch(ignored){}
    }

    async function loadNepalLocationMaster(){
      if(
        nepalAddressState.master &&
        Array.isArray(
          nepalAddressState.master.items
        )
      ){
        return nepalAddressState.master;
      }

      const cached=
        readNepalMasterCache();

      if(cached){
        nepalAddressState.master=cached;
        return cached;
      }

      if(
        nepalAddressState.loadingPromise
      ){
        return nepalAddressState.loadingPromise;
      }

      nepalAddressState.loadingPromise=
        api(
          "getNepalLocationMaster"
        )
          .then(data=>{
            nepalAddressState.master=data;
            writeNepalMasterCache(data);
            return data;
          })
          .finally(()=>{
            nepalAddressState.loadingPromise=null;
          });

      return nepalAddressState.loadingPromise;
    }

    function setLocationSelectLoading(
      select,
      text
    ){
      if(!select)return;

      select.disabled=true;
      select.innerHTML=
        `<option value="">${esc(text||"Loading...")}</option>`;
    }

    function fillLocationSelect(
      select,
      items,
      placeholder,
      valueKey="name",
      labelBuilder=null
    ){
      if(!select)return;

      select.innerHTML=
        `<option value="">${esc(placeholder)}</option>`+
        (items||[])
          .map(item=>{
            const value=
              item[valueKey]??"";

            const label=
              labelBuilder
                ? labelBuilder(item)
                : item.name??value;

            return `
              <option
                value="${esc(value)}"
                data-id="${esc(item.id??"")}"
                data-wards="${esc(item.totalWards??"")}">
                ${esc(label)}
              </option>
            `;
          })
          .join("");

      select.disabled=false;
    }

    function findOptionByText(
      select,
      text
    ){
      if(!select || !text)return null;

      const target=
        String(text)
          .trim()
          .toLowerCase();

      return [...select.options]
        .find(option=>
          String(option.value||"")
            .trim()
            .toLowerCase()===target
        ) || null;
    }

    function getSelectedProvinceData(
      master,
      provinceSelect
    ){
      const option=
        provinceSelect.options[
          provinceSelect.selectedIndex
        ];

      const id=
        option?.dataset?.id||"";

      return (master.items||[])
        .find(item=>
          String(item.id)===
          String(id)
        ) || null;
    }

    function getSelectedDistrictData(
      provinceData,
      districtSelect
    ){
      const option=
        districtSelect.options[
          districtSelect.selectedIndex
        ];

      const id=
        option?.dataset?.id||"";

      return (provinceData?.districts||[])
        .find(item=>
          String(item.id)===
          String(id)
        ) || null;
    }

    function getSelectedLocalLevelData(
      districtData,
      municipalitySelect
    ){
      const option=
        municipalitySelect.options[
          municipalitySelect.selectedIndex
        ];

      const id=
        option?.dataset?.id||"";

      return (districtData?.localLevels||[])
        .find(item=>
          String(item.id)===
          String(id)
        ) || null;
    }

    async function setupNepalAddressCascade({
      provinceId,
      districtId,
      municipalityId,
      wardId,
      initialProvince="",
      initialDistrict="",
      initialMunicipality="",
      initialWard=""
    }){
      const province=$(provinceId);
      const district=$(districtId);
      const municipality=$(municipalityId);
      const ward=$(wardId);

      if(
        !province ||
        !district ||
        !municipality ||
        !ward
      ){
        return;
      }

      setLocationSelectLoading(
        province,
        "Province लोड हुँदैछ..."
      );

      const master=
        await loadNepalLocationMaster();

      fillLocationSelect(
        province,
        master.items||[],
        "Province छान्नुहोस्"
      );

      if(initialProvince){
        const option=
          findOptionByText(
            province,
            initialProvince
          );

        if(option){
          province.value=
            option.value;
        }
      }

      const loadDistricts=(
        restoreValue=""
      )=>{
        municipality.disabled=true;
        municipality.innerHTML=
          `<option value="">पहिले District छान्नुहोस्</option>`;

        ward.disabled=true;
        ward.innerHTML=
          `<option value="">पहिले Local Level छान्नुहोस्</option>`;

        const provinceData=
          getSelectedProvinceData(
            master,
            province
          );

        if(!provinceData){
          district.disabled=true;
          district.innerHTML=
            `<option value="">पहिले Province छान्नुहोस्</option>`;
          return;
        }

        fillLocationSelect(
          district,
          provinceData.districts||[],
          "District छान्नुहोस्"
        );

        if(restoreValue){
          const option=
            findOptionByText(
              district,
              restoreValue
            );

          if(option){
            district.value=
              option.value;
          }
        }
      };

      const loadMunicipalities=(
        restoreValue=""
      )=>{
        ward.disabled=true;
        ward.innerHTML=
          `<option value="">पहिले Local Level छान्नुहोस्</option>`;

        const provinceData=
          getSelectedProvinceData(
            master,
            province
          );

        const districtData=
          getSelectedDistrictData(
            provinceData,
            district
          );

        if(!districtData){
          municipality.disabled=true;
          municipality.innerHTML=
            `<option value="">पहिले District छान्नुहोस्</option>`;
          return;
        }

        fillLocationSelect(
          municipality,
          districtData.localLevels||[],
          "Municipality / Rural Municipality छान्नुहोस्",
          "name",
          item=>
            `${item.name} (${item.type||"स्थानीय तह"})`
        );

        if(restoreValue){
          const option=
            findOptionByText(
              municipality,
              restoreValue
            );

          if(option){
            municipality.value=
              option.value;
          }
        }
      };

      const loadWards=(
        restoreValue=""
      )=>{
        const provinceData=
          getSelectedProvinceData(
            master,
            province
          );

        const districtData=
          getSelectedDistrictData(
            provinceData,
            district
          );

        const localData=
          getSelectedLocalLevelData(
            districtData,
            municipality
          );

        if(!localData){
          ward.disabled=true;
          ward.innerHTML=
            `<option value="">पहिले Local Level छान्नुहोस्</option>`;
          return;
        }

        const wards=[];

        for(
          let i=1;
          i<=Number(localData.totalWards||0);
          i++
        ){
          wards.push({
            number:i,
            label:`वडा नं. ${i}`
          });
        }

        fillLocationSelect(
          ward,
          wards,
          "Ward No. छान्नुहोस्",
          "number",
          item=>item.label
        );

        if(
          restoreValue!=="" &&
          restoreValue!==null &&
          restoreValue!==undefined
        ){
          const target=
            String(restoreValue)
              .replace(/\D/g,"");

          const matching=
            [...ward.options]
              .find(option=>
                String(option.value)===
                target
              );

          if(matching){
            ward.value=
              matching.value;
          }
        }
      };

      province.onchange=()=>{
        loadDistricts();
      };

      district.onchange=()=>{
        loadMunicipalities();
      };

      municipality.onchange=()=>{
        loadWards();
      };

      if(province.value){
        loadDistricts(
          initialDistrict
        );
      }

      if(
        district.value &&
        initialMunicipality
      ){
        loadMunicipalities(
          initialMunicipality
        );
      }

      if(
        municipality.value &&
        initialWard!==""
      ){
        loadWards(
          initialWard
        );
      }
    }

            "TransactionType",
            "Points",
            "BalanceAfter",
            "Reason",
            "Reference",
            "CreatedAt"
          ]
        )}
      `;
    }

    function renderSecurity(){
      $("memberContent").innerHTML=`
        <h2 class="section-title">PIN / Security</h2>

        <p>
          Member PIN सेट गरेपछि अर्को Login देखि PIN पनि आवश्यक हुन्छ ।
        </p>

        <form id="memberPinForm">
          <label>New PIN (4–8 digits)</label>
          <input
            name="newPin"
            type="password"
            inputmode="numeric"
            minlength="4"
            maxlength="8"
            required
          >

          <button
            class="primary"
            type="submit"
            style="margin-top:14px">
            PIN Set / Change
          </button>
        </form>
      `;

      $("memberPinForm")
        .addEventListener(
          "submit",
          async event=>{
            event.preventDefault();

            const payload=
              Object.fromEntries(
                new FormData(
                  event.currentTarget
                ).entries()
              );

            payload.token=
              state.token;

            try{
              const result=
                await api(
                  "memberSetPin",
                  payload,
                  "POST"
                );

              alert(
                result.message ||
                "PIN अपडेट भयो ।"
              );

              event.currentTarget.reset();

            }catch(error){
              alert(error.message);
            }
          }
        );
    }

    function simpleTable(rows, columns){
      if(!rows.length){
        return `<div class="message">रेकर्ड उपलब्ध छैन ।</div>`;
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                ${columns.map(c=>`<th>${esc(c)}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows.map(row=>`
                <tr>
                  ${columns.map(c=>`
                    <td>
                      ${
                        /Amount|Points|Balance/.test(c)
                          ? money(row[c]||0)
                          : esc(row[c]??"")
                      }
                    </td>
                  `).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }


    // Start loading Nepal location master quietly in the background.
    // If localStorage has a valid 24-hour cache, this returns instantly.
    loadNepalLocationMaster()
      .catch(()=>{});

    initializePortal();
  </script>
</body>
</html>
