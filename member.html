<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Pilgrim Member Portal | Guru Tirtha Yatra Sewa</title>

  <style>
    :root{
      --primary:#8b1e1e;
      --primary-dark:#5f1414;
      --gold:#d4a017;
      --bg:#fff8ea;
      --surface:#fff;
      --soft:#f6efe8;
      --text:#2c1b15;
      --muted:#6f625c;
      --border:#eadbc7;
      --success:#177245;
      --danger:#b42318;
      --shadow:0 18px 48px rgba(65,36,20,.12);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:"Noto Sans Devanagari",system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .hidden{display:none!important}

    .wrap{
      width:min(1180px,calc(100% - 28px));
      margin:24px auto 50px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:center;
      margin-bottom:18px;
    }

    .brand h1{
      margin:0;
      color:var(--primary);
      font-size:1.5rem;
    }

    .brand small{color:var(--muted)}

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:20px;
    }

    .login{
      width:min(520px,100%);
      margin:70px auto;
    }

    label{
      display:block;
      font-weight:700;
      margin:12px 0 6px;
    }

    input,select,textarea{
      width:100%;
      padding:12px 13px;
      border:1px solid #d9c8b8;
      border-radius:11px;
      font:inherit;
      background:#fff;
    }

    button,.btn{
      border:0;
      border-radius:11px;
      min-height:44px;
      padding:10px 14px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .primary{background:var(--primary);color:#fff}
    .soft{background:#f3e8df;color:var(--primary)}
    .danger{background:var(--danger);color:#fff}

    .dashboard-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:16px;
    }

    .stat{
      padding:16px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
    }

    .stat small{
      display:block;
      color:var(--muted);
      margin-bottom:4px;
    }

    .stat strong{
      font-size:1.2rem;
    }

    .layout{
      display:grid;
      grid-template-columns:230px 1fr;
      gap:18px;
    }

    .menu{
      display:grid;
      gap:7px;
      align-content:start;
    }

    .menu button{
      justify-content:flex-start;
      background:#fff;
      border:1px solid var(--border);
      color:var(--text);
    }

    .menu button.active{
      background:var(--primary);
      color:#fff;
    }

    .member-card{
      border:2px solid var(--gold);
      border-radius:18px;
      padding:20px;
      background:linear-gradient(135deg,#fffdf5,#fff6d8);
    }

    .member-card-top{
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:center;
    }

    .member-level{
      display:inline-block;
      margin-top:8px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--primary);
      color:#fff;
      font-weight:800;
    }

    .table-wrap{overflow:auto}

    table{
      width:100%;
      border-collapse:collapse;
      min-width:720px;
    }

    th,td{
      padding:11px 10px;
      border-bottom:1px solid var(--border);
      text-align:left;
      vertical-align:top;
    }

    th{
      background:#faf5ef;
      color:var(--primary);
    }

    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .section-title{
      margin-top:0;
      color:var(--primary);
    }

    .message{
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      background:#edf8f2;
      color:#155f3b;
    }

    @media(max-width:860px){
      .layout{grid-template-columns:1fr}
      .menu{
        grid-template-columns:repeat(3,minmax(0,1fr));
      }
      .dashboard-grid{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:560px){
      .dashboard-grid{
        grid-template-columns:1fr;
      }
      .menu{
        grid-template-columns:1fr 1fr;
      }
      .member-card-top{
        align-items:flex-start;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section id="loginView" class="login card">
      <div class="brand">
        <h1>Guru Tirtha Yatra Sewa</h1>
        <small>Pilgrim / Member Portal</small>
      </div>

      <form id="memberLoginForm">
        <label>Membership No *</label>
        <input name="membershipNo" required>

        <label>Registered Mobile *</label>
        <input name="mobile" inputmode="tel" required>

        <label>Member PIN</label>
        <input name="pin" type="password" inputmode="numeric" placeholder="यदि PIN सेट गरिएको छ भने">

        <button class="primary" type="submit" style="width:100%;margin-top:16px">
          Member Login
        </button>
      </form>

      <div id="loginMessage"></div>
    </section>

    <section id="portalView" class="hidden">
      <div class="topbar">
        <div class="brand">
          <h1>Guru Tirtha Yatra Sewa</h1>
          <small id="memberWelcome">Member Portal</small>
        </div>

        <button id="memberLogoutBtn" class="danger" type="button">
          Logout
        </button>
      </div>

      <div id="memberStats" class="dashboard-grid"></div>

      <div class="layout">
        <aside class="menu card">
          <button data-view="card" class="active">🪪 Membership Card</button>
          <button data-view="profile">👤 Profile</button>
          <button data-view="bookings">📋 Bookings</button>
          <button data-view="payments">💳 Payments</button>
          <button data-view="tickets">🎫 E-Tickets</button>
          <button data-view="rewards">🎁 Rewards</button>
          <button data-view="security">🔐 PIN / Security</button>
        </aside>

        <section id="memberContent" class="card"></section>
      </div>
    </section>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzrKZBb_lg8TiI_HHp390Cscr31XWgcnsG0Jp5qFkkpUYaCoin3TLnJ6TY1RDFyRuI2/exec";

    const state = {
      token:
        localStorage.getItem("gtymsMemberToken") || "",
      dashboard:null,
      profile:null
    };

    const $ = id =>
      document.getElementById(id);

    function esc(value){
      return String(value??"")
        .replace(/[&<>"']/g,ch=>({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[ch]));
    }

    function money(value){
      return Number(value||0)
        .toLocaleString("en-IN");
    }

    async function api(
      action,
      payload={},
      method="GET"
    ){
      let response;

      if(method==="POST"){
        response=await fetch(API_URL,{
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:JSON.stringify(
            Object.assign(
              {action},
              payload
            )
          )
        });
      }else{
        const url=new URL(API_URL);
        url.searchParams.set(
          "action",
          action
        );

        Object.entries(payload)
          .forEach(([key,value])=>{
            if(
              value!==undefined &&
              value!==null
            ){
              url.searchParams.set(
                key,
                value
              );
            }
          });

        response=
          await fetch(
            url.toString()
          );
      }

      const json=
        await response.json();

      if(!json.success){
        const error=
          new Error(
            json.error?.message ||
            "Request failed"
          );

        error.code=
          json.error?.code||"";

        throw error;
      }

      return json.data;
    }

    function showLogin(){
      $("loginView")
        .classList.remove("hidden");

      $("portalView")
        .classList.add("hidden");
    }

    function showPortal(){
      $("loginView")
        .classList.add("hidden");

      $("portalView")
        .classList.remove("hidden");
    }

    async function initializePortal(){
      if(!state.token){
        showLogin();
        return;
      }

      try{
        await loadDashboard();
        showPortal();
        renderMemberCard();
      }catch(error){
        localStorage.removeItem(
          "gtymsMemberToken"
        );

        state.token="";
        showLogin();
      }
    }

    $("memberLoginForm")
      .addEventListener(
        "submit",
        async event=>{
          event.preventDefault();

          const payload=
            Object.fromEntries(
              new FormData(
                event.currentTarget
              ).entries()
            );

          $("loginMessage").textContent=
            "Login हुँदैछ...";

          try{
            const result=
              await api(
                "memberLogin",
                payload,
                "POST"
              );

            state.token=
              result.token;

            localStorage.setItem(
              "gtymsMemberToken",
              state.token
            );

            state.profile=
              result.member;

            await loadDashboard();

            $("loginMessage").textContent="";
            showPortal();
            renderMemberCard();

          }catch(error){
            $("loginMessage").innerHTML=
              `<div class="message" style="background:#fde7e3;color:#8a1c12">
                ${esc(error.message)}
              </div>`;
          }
        }
      );

    $("memberLogoutBtn")
      .addEventListener(
        "click",
        async()=>{
          try{
            await api(
              "memberLogout",
              {
                token:state.token
              },
              "POST"
            );
          }catch(ignored){}

          localStorage.removeItem(
            "gtymsMemberToken"
          );

          state.token="";
          state.dashboard=null;
          showLogin();
        }
      );

    document.querySelectorAll(
      ".menu button[data-view]"
    ).forEach(button=>{
      button.addEventListener(
        "click",
        async()=>{
          document.querySelectorAll(
            ".menu button[data-view]"
          ).forEach(b=>
            b.classList.remove(
              "active"
            )
          );

          button.classList.add(
            "active"
          );

          const view=
            button.dataset.view;

          if(view==="card"){
            renderMemberCard();
          }else if(view==="profile"){
            await renderProfile();
          }else if(view==="bookings"){
            await renderBookings();
          }else if(view==="payments"){
            await renderPayments();
          }else if(view==="tickets"){
            await renderTickets();
          }else if(view==="rewards"){
            await renderRewards();
          }else if(view==="security"){
            renderSecurity();
          }
        }
      );
    });

    async function loadDashboard(){
      const data=
        await api(
          "memberGetDashboard",
          {
            token:state.token
          }
        );

      state.dashboard=data;
      state.profile=data.profile;

      $("memberWelcome").textContent=
        `नमस्कार, ${data.profile?.FullName||"Member"}`;

      const c=data.cards||{};

      $("memberStats").innerHTML=`
        <div class="stat"><small>Membership Level</small><strong>${esc(c.membershipLevel||"")}</strong></div>
        <div class="stat"><small>Reward Points</small><strong>${esc(c.rewardPoints||0)}</strong></div>
        <div class="stat"><small>Total Trips</small><strong>${esc(c.totalTrips||0)}</strong></div>
        <div class="stat"><small>Bookings</small><strong>${esc(c.totalBookings||0)}</strong></div>
      `;
    }

    function renderMemberCard(){
      const p=
        state.profile||{};

      $("memberContent").innerHTML=`
        <h2 class="section-title">Digital Membership Card</h2>

        <div class="member-card">
          <div class="member-card-top">
            <div>
              <small>Guru Tirtha Yatra Sewa</small>
              <h2 style="margin:5px 0">${esc(p.FullName||"")}</h2>
              <strong>${esc(p.MembershipNo||p.PilgrimID||"")}</strong>
              <br>
              <span class="member-level">
                ${esc(p.MembershipLevel||"NEW_PILGRIM")}
              </span>
            </div>

            <div>
              <strong>Reward Points</strong><br>
              <span style="font-size:2rem;color:var(--primary);font-weight:900">
                ${esc(p.RewardPoints||0)}
              </span>
            </div>
          </div>

          <hr style="border:0;border-top:1px solid #e6d7b5;margin:18px 0">

          <div>
            Mobile: ${esc(p.MobilePrimary||"")}<br>
            District: ${esc(p.District||"-")}<br>
            Total Trips: ${esc(p.TotalTrips||0)}
          </div>
        </div>

        <div class="toolbar" style="margin-top:16px">
          <button class="soft" onclick="window.print()">
            Print / Save Card
          </button>
        </div>
      `;
    }

    async function renderProfile(){
      const data=
        await api(
          "memberGetProfile",
          {
            token:state.token
          }
        );

      const p=data.profile||{};

      $("memberContent").innerHTML=`
        <h2 class="section-title">Profile</h2>

        <form id="memberProfileForm">
          <label>Full Name</label>
          <input value="${esc(p.FullName||"")}" disabled>

          <label>Primary Mobile</label>
          <input value="${esc(p.MobilePrimary||"")}" disabled>

          <label>Email</label>
          <input name="email" value="${esc(p.Email||"")}">

          <label>Secondary Mobile</label>
          <input name="mobileSecondary" value="${esc(p.MobileSecondary||"")}">

          <label>Province</label>
          <input name="province" value="${esc(p.Province||"")}">

          <label>District</label>
          <input name="district" value="${esc(p.District||"")}">

          <label>Municipality</label>
          <input name="municipality" value="${esc(p.Municipality||"")}">

          <label>Ward No.</label>
          <input name="wardNo" value="${esc(p.WardNo||"")}">

          <label>Address</label>
          <textarea name="address">${esc(p.Address||"")}</textarea>

          <label>Emergency Contact Name</label>
          <input name="emergencyContactName" value="${esc(p.EmergencyContactName||"")}">

          <label>Emergency Contact Relation</label>
          <input name="emergencyContactRelation" value="${esc(p.EmergencyContactRelation||"")}">

          <label>Emergency Contact Mobile</label>
          <input name="emergencyContactMobile" value="${esc(p.EmergencyContactMobile||"")}">

          <label>Preferred Seat</label>
          <input name="preferredSeat" value="${esc(p.PreferredSeat||"")}">

          <label>Preferred Food</label>
          <select name="preferredFood">
            <option value="VEGETARIAN" ${p.PreferredFood==="VEGETARIAN"?"selected":""}>VEGETARIAN</option>
            <option value="JAIN" ${p.PreferredFood==="JAIN"?"selected":""}>JAIN</option>
            <option value="OTHER" ${p.PreferredFood==="OTHER"?"selected":""}>OTHER</option>
          </select>

          <div class="toolbar" style="margin-top:14px">
            <button class="primary" type="submit">
              Profile Update
            </button>
          </div>
        </form>
      `;

      $("memberProfileForm")
        .addEventListener(
          "submit",
          async event=>{
            event.preventDefault();

            const payload=
              Object.fromEntries(
                new FormData(
                  event.currentTarget
                ).entries()
              );

            payload.token=
              state.token;

            try{
              const result=
                await api(
                  "memberUpdateProfile",
                  payload,
                  "POST"
                );

              state.profile=
                result.profile;

              alert(
                "Profile अपडेट भयो ।"
              );

              await loadDashboard();

            }catch(error){
              alert(error.message);
            }
          }
        );
    }

    async function renderBookings(){
      const data=
        await api(
          "memberGetBookings",
          {
            token:state.token
          }
        );

      $("memberContent").innerHTML=`
        <h2 class="section-title">Booking History</h2>
        ${simpleTable(
          data.items||[],
          [
            "BookingCode",
            "TripTitle",
            "StartDate",
            "PassengerCount",
            "NetAmount",
            "PaidAmount",
            "DueAmount",
            "PaymentStatus",
            "BookingStatus"
          ]
        )}
      `;
    }

    async function renderPayments(){
      const data=
        await api(
          "memberGetPayments",
          {
            token:state.token
          }
        );

      $("memberContent").innerHTML=`
        <h2 class="section-title">Payment History</h2>
        ${simpleTable(
          data.items||[],
          [
            "PaymentCode",
            "BookingCode",
            "Amount",
            "VerifiedAmount",
            "VerificationStatus",
            "ReceiptNumber",
            "PaymentDate"
          ]
        )}
      `;
    }

    async function renderTickets(){
      const data=
        await api(
          "memberGetTickets",
          {
            token:state.token
          }
        );

      $("memberContent").innerHTML=`
        <h2 class="section-title">E-Tickets</h2>
        ${simpleTable(
          data.items||[],
          [
            "TicketCode",
            "TripTitle",
            "StartDate",
            "BusID",
            "SeatID",
            "CheckInStatus",
            "BoardingStatus"
          ]
        )}
      `;
    }

    async function renderRewards(){
      const data=
        await api(
          "memberGetRewards",
          {
            token:state.token
          }
        );

      $("memberContent").innerHTML=`
        <h2 class="section-title">Rewards</h2>

        <div class="member-card" style="margin-bottom:16px">
          <small>Current Reward Balance</small>
          <h2 style="margin:5px 0">
            ${esc(data.balance||0)} Points
          </h2>
        </div>

        ${simpleTable(
          data.items||[],
          [
            "TransactionType",
            "Points",
            "BalanceAfter",
            "Reason",
            "Reference",
            "CreatedAt"
          ]
        )}
      `;
    }

    function renderSecurity(){
      $("memberContent").innerHTML=`
        <h2 class="section-title">PIN / Security</h2>

        <p>
          Member PIN सेट गरेपछि अर्को Login देखि PIN पनि आवश्यक हुन्छ ।
        </p>

        <form id="memberPinForm">
          <label>New PIN (4–8 digits)</label>
          <input
            name="newPin"
            type="password"
            inputmode="numeric"
            minlength="4"
            maxlength="8"
            required
          >

          <button
            class="primary"
            type="submit"
            style="margin-top:14px">
            PIN Set / Change
          </button>
        </form>
      `;

      $("memberPinForm")
        .addEventListener(
          "submit",
          async event=>{
            event.preventDefault();

            const payload=
              Object.fromEntries(
                new FormData(
                  event.currentTarget
                ).entries()
              );

            payload.token=
              state.token;

            try{
              const result=
                await api(
                  "memberSetPin",
                  payload,
                  "POST"
                );

              alert(
                result.message ||
                "PIN अपडेट भयो ।"
              );

              event.currentTarget.reset();

            }catch(error){
              alert(error.message);
            }
          }
        );
    }

    function simpleTable(rows, columns){
      if(!rows.length){
        return `<div class="message">रेकर्ड उपलब्ध छैन ।</div>`;
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                ${columns.map(c=>`<th>${esc(c)}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows.map(row=>`
                <tr>
                  ${columns.map(c=>`
                    <td>
                      ${
                        /Amount|Points|Balance/.test(c)
                          ? money(row[c]||0)
                          : esc(row[c]??"")
                      }
                    </td>
                  `).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    initializePortal();
  </script>
</body>
</html>
